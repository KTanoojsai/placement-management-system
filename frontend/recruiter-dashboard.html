<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard — Placement Portal</title>
    <meta name="description" content="Recruiter dashboard - manage job posts and process student applications.">
    <script>
        if (window.location.protocol === "file:") {
            window.location.replace("http://localhost:5000/recruiter-dashboard.html");
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Placement Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-section="home">
                    <span class="icon">🏠</span> Dashboard
                </button>
                <button class="nav-btn" data-section="addJob">
                    <span class="icon">➕</span> Post Public Job
                </button>
                <button class="nav-btn" data-section="jobs">
                    <span class="icon">🏢</span> My Job Posts
                </button>
                <button class="nav-btn" data-section="applications">
                    <span class="icon">📋</span> Applications
                </button>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span> Logout
            </button>
        </aside>
        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <button class="hamburger" id="menuToggle">☰</button>
                    <div>
                        <h1 id="welcome">Welcome, Recruiter!</h1>
                        <p>Manage your job postings and applications.</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="notification-container">
                        <button class="notification-bell" id="notificationBell" aria-label="Notifications">
                            🔔
                            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                        </button>
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="dropdown-header">
                                <h3>Notifications</h3>
                                <button class="btn-text" id="markAllReadBtn">Mark all as read</button>
                            </div>
                            <div class="dropdown-body" id="notificationList">
                                <div class="notification-empty">No notifications yet</div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="content-body">
                <section id="home" class="section active">
                    <h2>Dashboard Overview</h2>
                    <div class="cards-grid">
                        <div class="stat-card">
                            <div class="stat-icon blue">🏢</div>
                            <div>
                                <div class="stat-value" id="jobCount">0</div>
                                <div class="stat-label">Active Job Posts</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon amber">📋</div>
                            <div>
                                <div class="stat-value" id="applicationCount">0</div>
                                <div class="stat-label">Applications Received</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">✅</div>
                            <div>
                                <div class="stat-value" id="placedCount">0</div>
                                <div class="stat-label">Hired Candidates</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="addJob" class="section">
                    <h2>Post a New Public Job</h2>
                    <div class="form-card">
                        <h3>Job Details</h3>
                        <form id="jobForm">
                            <div class="form-grid">
                                <div>
                                    <label for="companyName">Company Name</label>
                                    <input type="text" id="companyName" class="form-input" required>
                                </div>
                                <div>
                                    <label for="jobRole">Job Role / Title</label>
                                    <input type="text" id="jobRole" class="form-input" required>
                                </div>
                                <div>
                                    <label for="eligibility">Eligibility summary</label>
                                    <input type="text" id="eligibility" class="form-input" placeholder="e.g. B.Tech / MCA" required>
                                </div>
                                <div>
                                    <label for="minimumCGPA">Minimum CGPA Required</label>
                                    <input type="number" id="minimumCGPA" class="form-input" step="0.1" min="0" max="10" placeholder="e.g. 6.5" required>
                                </div>
                                <div>
                                    <label for="location">Location</label>
                                    <input type="text" id="location" class="form-input" required>
                                </div>
                                <div>
                                    <label for="package">Package / Salary</label>
                                    <input type="text" id="package" class="form-input" placeholder="e.g. 8 LPA" required>
                                </div>
                                <div style="grid-column: 1 / -1;">
                                    <label for="description">Job Description</label>
                                    <textarea id="description" class="form-input" style="height: 100px; width: 100%; box-sizing: border-box; resize: vertical;" placeholder="Enter job description, duties, and requirements..."></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 20px;">Publish Public Job</button>
                        </form>
                    </div>
                </section>

                <section id="jobs" class="section">
                    <h2>My Job Postings</h2>
                    <div id="jobList" class="company-cards-grid">
                        <!-- Dynamically filled -->
                    </div>
                </section>

                <section id="applications" class="section">
                    <h2>Applications Received</h2>
                    <div id="applicationList">
                        <!-- Dynamically filled -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:5000"
            : "https://placement-management-backend-x5mq.onrender.com";

        // Auth check
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("token");
        if (!user || !token || !user.role || user.role.toUpperCase() !== "RECRUITER") {
            localStorage.removeItem("user");
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }
        if (user && user.name) {
            document.getElementById("welcome").textContent = "Welcome, " + user.name + "!";
        }

        // Toast function
        function showToast(message, type = "info") {
            let container = document.querySelector(".toast-container");
            if (!container) {
                container = document.createElement("div");
                container.className = "toast-container";
                document.body.appendChild(container);
            }
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            const icons = { success: "✓", error: "✕", info: "ℹ" };
            toast.innerHTML = `<span>${icons[type] || "ℹ"}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("hiding");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fetch wrapper
        async function fetchJson(url, options = {}) {
            try {
                const authToken = localStorage.getItem("token");
                const headers = {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                };
                if (authToken) {
                    headers["Authorization"] = `Bearer ${authToken}`;
                }

                const requestUrl = url.startsWith("/") ? `${API_BASE_URL}${url}` : url;
                const response = await fetch(requestUrl, {
                    ...options,
                    headers
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem("user");
                    localStorage.removeItem("token");
                    window.location.href = "index.html";
                    return null;
                }

                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'An error occurred');
                }
                return data;
            } catch (err) {
                console.error(err);
                throw err;
            }
        }

        // Navigation
        const navBtns = document.querySelectorAll(".nav-btn");
        const sections = document.querySelectorAll(".section");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const menuToggle = document.getElementById("menuToggle");

        navBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetSection = btn.getAttribute("data-section");

                navBtns.forEach(b => b.classList.remove("active"));
                sections.forEach(s => s.classList.remove("active"));

                btn.classList.add("active");
                document.getElementById(targetSection).classList.add("active");

                if (targetSection === "jobs") loadJobs();
                if (targetSection === "applications") loadApplications();

                if (window.innerWidth <= 768) {
                    sidebar.classList.remove("open");
                    sidebarOverlay.classList.remove("open");
                }
            });
        });

        // Hamburger
        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            sidebarOverlay.classList.toggle("open");
        });

        sidebarOverlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("open");
        });

        // Dashboard Stats
        async function loadDashboardStats() {
            try {
                const jobs = await fetchJson("/api/companies");
                if (jobs) {
                    document.getElementById("jobCount").textContent = jobs.length;
                }

                const apps = await fetchJson("/api/companies/all-applications/list");
                if (apps) {
                    document.getElementById("applicationCount").textContent = apps.length;
                    const hired = apps.filter(a => a.status === "Selected").length;
                    document.getElementById("placedCount").textContent = hired;
                }
            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        // Add Job
        document.getElementById("jobForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById("companyName").value,
                role: document.getElementById("jobRole").value,
                eligibility: document.getElementById("eligibility").value,
                minimumCGPA: parseFloat(document.getElementById("minimumCGPA").value),
                location: document.getElementById("location").value,
                package: document.getElementById("package").value,
                description: document.getElementById("description").value,
                visibility: "PUBLIC"
            };

            try {
                const res = await fetchJson("/api/companies", {
                    method: "POST",
                    body: JSON.stringify(data)
                });

                if (res) {
                    showToast("Public job opportunity published successfully!", "success");
                    document.getElementById("jobForm").reset();
                    loadDashboardStats();
                }
            } catch (err) {
                showToast(err.message || "Error publishing job", "error");
            }
        });

        // Load Jobs
        async function loadJobs() {
            const list = document.getElementById("jobList");
            list.innerHTML = "Loading...";
            try {
                const jobs = await fetchJson("/api/companies");
                if (jobs) {
                    if (jobs.length === 0) {
                        list.innerHTML = "<div class='empty-state'>You have not posted any jobs yet.</div>";
                        return;
                    }

                    list.innerHTML = jobs.map(j => `
                        <div class="company-card">
                            <h3>${j.name}</h3>
                            <div class="detail"><span class="label">Role:</span> ${j.role}</div>
                            <div class="detail"><span class="label">Min CGPA:</span> ${j.minimumCGPA || "—"}</div>
                            <div class="detail"><span class="label">Location:</span> ${j.location}</div>
                            <div class="detail"><span class="label">Package:</span> ${j.package}</div>
                            <div class="actions">
                                <button class="btn-danger btn-sm" onclick="deleteJob('${j._id}')">Delete</button>
                            </div>
                        </div>
                    `).join("");
                }
            } catch (err) {
                list.innerHTML = "<div class='empty-state'>Error loading job posts</div>";
            }
        }

        // Delete Job
        async function deleteJob(id) {
            if (!confirm("Are you sure you want to delete this job posting? All student applications for this job will be lost.")) return;
            try {
                const res = await fetchJson(`/api/companies/${id}`, { method: "DELETE" });
                if (res) {
                    showToast("Job posting deleted", "success");
                    loadJobs();
                    loadDashboardStats();
                }
            } catch (err) {
                showToast(err.message || "Error deleting job", "error");
            }
        }

        // Load Applications
        async function loadApplications() {
            const container = document.getElementById("applicationList");
            container.innerHTML = "Loading...";
            try {
                const apps = await fetchJson("/api/companies/all-applications/list");
                if (apps) {
                    if (apps.length === 0) {
                        container.innerHTML = "<div class='empty-state'>No student applications received yet.</div>";
                        return;
                    }

                    let tableHtml = `
                        <div class="glass-card" style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Candidate Name</th>
                                    <th>Email / Phone</th>
                                    <th>CGPA / Branch</th>
                                    <th>Skills</th>
                                    <th>Resume</th>
                                    <th>Job Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    tableHtml += apps.map(app => {
                        const statusClass = `badge badge-${app.status.toLowerCase()}`;
                        let actionsHtml = "";
                        if (app.status === "Applied") {
                            actionsHtml = `
                                <button class="btn-warning btn-sm" onclick="updateStatus('${app._id}', 'Shortlisted')">Shortlist</button>
                                <button class="btn-danger btn-sm" onclick="updateStatus('${app._id}', 'Rejected')">Reject</button>
                            `;
                        } else if (app.status === "Shortlisted") {
                            actionsHtml = `
                                <button class="btn-success btn-sm" onclick="updateStatus('${app._id}', 'Selected')">Hire</button>
                                <button class="btn-danger btn-sm" onclick="updateStatus('${app._id}', 'Rejected')">Reject</button>
                            `;
                        } else if (app.status === "Selected" || app.status === "Rejected") {
                            actionsHtml = `<span class="${statusClass}">${app.status === "Selected" ? "Hired" : app.status}</span>`;
                        }

                        let resumeHtml = "—";
                        if (app.student && app.student.resume) {
                            const fileUrl = app.student.resume.startsWith('/') ? `${API_BASE_URL}${app.student.resume}` : app.student.resume;
                            resumeHtml = `<a href="${fileUrl}" target="_blank" class="btn-text">View Resume</a>`;
                        }

                        return `
                            <tr>
                                <td>
                                    <strong>${app.student ? app.student.name : "—"}</strong><br>
                                    <small>
                                        ${app.student && app.student.linkedin ? `<a href="${app.student.linkedin}" target="_blank" class="btn-text" style="margin-right: 0.5rem;">LinkedIn</a>` : ''}
                                        ${app.student && app.student.github ? `<a href="${app.student.github}" target="_blank" class="btn-text">GitHub</a>` : ''}
                                    </small>
                                </td>
                                <td>${app.student ? app.student.email : "—"}<br><small>${app.student && app.student.phone ? app.student.phone : "—"}</small></td>
                                <td>CGPA: ${app.student && app.student.cgpa ? app.student.cgpa : "—"}<br><small>${app.student && app.student.branch ? app.student.branch : "—"}</small></td>
                                <td><small>${(app.student && app.student.skills) ? app.student.skills.join(", ") : "—"}</small></td>
                                <td>${resumeHtml}</td>
                                <td>${app.company ? app.company.role : "—"}<br><small>${app.company ? app.company.name : "—"}</small></td>
                                <td><span class="${statusClass}">${app.status}</span></td>
                                <td>${actionsHtml}</td>
                            </tr>
                        `;
                    }).join("");

                    tableHtml += `</tbody></table></div>`;
                    container.innerHTML = tableHtml;
                }
            } catch (err) {
                container.innerHTML = "<div class='empty-state'>Error loading applications</div>";
            }
        }

        // Update Application Status
        async function updateStatus(applicationId, status) {
            try {
                const res = await fetchJson(`/api/companies/applications/${applicationId}/status`, {
                    method: "PUT",
                    body: JSON.stringify({ status })
                });

                if (res) {
                    showToast("Application status updated!", "success");
                    loadApplications();
                    loadDashboardStats();
                }
            } catch (err) {
                showToast(err.message || "Error updating status", "error");
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem("user");
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        // Notifications
        const notificationBell = document.getElementById("notificationBell");
        const notificationDropdown = document.getElementById("notificationDropdown");
        const notificationBadge = document.getElementById("notificationBadge");
        const notificationList = document.getElementById("notificationList");
        const markAllReadBtn = document.getElementById("markAllReadBtn");

        notificationBell.addEventListener("click", (e) => {
            e.stopPropagation();
            notificationDropdown.classList.toggle("open");
            if (notificationDropdown.classList.contains("open")) {
                loadNotifications();
            }
        });

        document.addEventListener("click", () => {
            notificationDropdown.classList.remove("open");
        });

        notificationDropdown.addEventListener("click", (e) => {
            e.stopPropagation();
        });

        async function loadNotifications() {
            try {
                const notifications = await fetchJson(`/api/notifications/${user.id}/${user.role}`);
                renderNotifications(notifications);
            } catch (error) {
                console.error("Failed to load notifications:", error);
            }
        }

        function renderNotifications(notifications) {
            notificationList.innerHTML = "";
            let unreadCount = 0;

            if (!notifications || notifications.length === 0) {
                notificationList.innerHTML = `<div class="notification-empty">No notifications yet</div>`;
                notificationBadge.style.display = "none";
                return;
            }

            notifications.forEach(notif => {
                if (!notif.read) unreadCount++;

                const notifEl = document.createElement("div");
                notifEl.className = `notification-item ${notif.read ? "" : "unread"}`;
                
                const timeString = formatTime(new Date(notif.createdAt));

                notifEl.innerHTML = `
                    <div class="notification-item-title">${notif.title}</div>
                    <div class="notification-item-desc">${notif.message}</div>
                    <div class="notification-item-time">${timeString}</div>
                `;

                if (!notif.read) {
                    notifEl.addEventListener("click", async () => {
                        try {
                            await fetchJson(`/api/notifications/${notif._id}/read`, {
                                method: "PUT",
                                body: JSON.stringify({ userId: user.id })
                            });
                            loadNotifications();
                        } catch (error) {
                            console.error("Failed to mark notification as read:", error);
                        }
                    });
                }

                notificationList.appendChild(notifEl);
            });

            if (unreadCount > 0) {
                notificationBadge.textContent = unreadCount;
                notificationBadge.style.display = "block";
            } else {
                notificationBadge.style.display = "none";
            }
        }

        markAllReadBtn.addEventListener("click", async () => {
            try {
                await fetchJson("/api/notifications/read-all", {
                    method: "PUT",
                    body: JSON.stringify({ userId: user.id })
                });
                loadNotifications();
            } catch (error) {
                console.error("Failed to mark all notifications as read:", error);
            }
        });

        function formatTime(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return "Just now";
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays === 1) return "Yesterday";
            return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        }

        function startNotificationPolling() {
            loadNotifications();
            setInterval(loadNotifications, 10000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadDashboardStats();
            startNotificationPolling();
        });
    </script>
</body>
</html>
