<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Placement Portal</title>
    <meta name="description" content="Placement Officer dashboard - manage companies, view students, and process applications.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Placement Portal</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-section="home">
                    <span class="icon">🏠</span> Dashboard
                </button>
                <button class="nav-btn" data-section="addCompany">
                    <span class="icon">➕</span> Add Company
                </button>
                <button class="nav-btn" data-section="companies">
                    <span class="icon">🏢</span> Companies
                </button>
                <button class="nav-btn" data-section="students">
                    <span class="icon">👥</span> Students
                </button>
                <button class="nav-btn" data-section="applications">
                    <span class="icon">📋</span> Applications
                </button>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span> Logout
            </button>
        </aside>
        <main class="main-content">
            <header class="content-header">
                <button class="hamburger" id="menuToggle">☰</button>
                <div>
                    <h1 id="welcome">Welcome, Admin!</h1>
                    <p>Manage placement activities efficiently.</p>
                </div>
            </header>
            <div class="content-body">
                <section id="home" class="section active">
                    <h2>Dashboard Overview</h2>
                    <div class="cards-grid">
                        <div class="stat-card">
                            <div class="stat-icon blue">🏢</div>
                            <div>
                                <div class="stat-value" id="companyCount">0</div>
                                <div class="stat-label">Total Companies</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon purple">👥</div>
                            <div>
                                <div class="stat-value" id="studentCount">0</div>
                                <div class="stat-label">Registered Students</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon amber">📋</div>
                            <div>
                                <div class="stat-value" id="applicationCount">0</div>
                                <div class="stat-label">Total Applications</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">✅</div>
                            <div>
                                <div class="stat-value" id="placedCount">0</div>
                                <div class="stat-label">Students Placed</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="addCompany" class="section">
                    <h2>Add New Company</h2>
                    <div class="form-card">
                        <h3>Company Details</h3>
                        <form id="companyForm">
                            <div class="form-grid">
                                <div>
                                    <label for="companyName">Company Name</label>
                                    <input type="text" id="companyName" class="form-input" required>
                                </div>
                                <div>
                                    <label for="jobRole">Job Role</label>
                                    <input type="text" id="jobRole" class="form-input" required>
                                </div>
                                <div>
                                    <label for="eligibility">Eligibility</label>
                                    <input type="text" id="eligibility" class="form-input" placeholder="e.g., B.Tech CSE" required>
                                </div>
                                <div>
                                    <label for="location">Location</label>
                                    <input type="text" id="location" class="form-input" required>
                                </div>
                                <div style="grid-column: 1 / -1;">
                                    <label for="package">Package</label>
                                    <input type="text" id="package" class="form-input full-width" placeholder="e.g., 6 LPA" required>
                                </div>
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 20px;">Add Company</button>
                        </form>
                    </div>
                </section>

                <section id="companies" class="section">
                    <h2>All Companies</h2>
                    <div id="companyList" class="company-cards-grid">
                        <!-- Dynamically filled -->
                    </div>
                </section>

                <section id="students" class="section">
                    <h2>All Registered Students</h2>
                    <div class="glass-card">
                        <div id="studentList">
                            <!-- Dynamically filled -->
                        </div>
                    </div>
                </section>

                <section id="applications" class="section">
                    <h2>All Applications</h2>
                    <div id="applicationList">
                        <!-- Dynamically filled -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        // Auth check
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user || user.role !== "admin") {
            window.location.href = "index.html";
        }
        document.getElementById("welcome").textContent = "Welcome, " + user.name + "!";

        // Toast function
        function showToast(message, type = "info") {
            let container = document.querySelector(".toast-container");
            if (!container) {
                container = document.createElement("div");
                container.className = "toast-container";
                document.body.appendChild(container);
            }
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            const icons = { success: "✓", error: "✕", info: "ℹ" };
            toast.innerHTML = `<span>${icons[type] || "ℹ"}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("hiding");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Navigation
        const navBtns = document.querySelectorAll(".nav-btn");
        const sections = document.querySelectorAll(".section");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebarOverlay");
        const menuToggle = document.getElementById("menuToggle");

        navBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetSection = btn.getAttribute("data-section");

                navBtns.forEach(b => b.classList.remove("active"));
                sections.forEach(s => s.classList.remove("active"));

                btn.classList.add("active");
                document.getElementById(targetSection).classList.add("active");

                if (targetSection === "companies") loadCompanies();
                if (targetSection === "students") loadStudents();
                if (targetSection === "applications") loadApplications();

                if (window.innerWidth <= 768) {
                    sidebar.classList.remove("open");
                    sidebarOverlay.classList.remove("open");
                }
            });
        });

        // Hamburger
        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            sidebarOverlay.classList.toggle("open");
        });

        sidebarOverlay.addEventListener("click", () => {
            sidebar.classList.remove("open");
            sidebarOverlay.classList.remove("open");
        });

        // Dashboard Stats
        async function loadDashboardStats() {
            try {
                const compRes = await fetch("/api/companies");
                if(compRes.ok) {
                    const companies = await compRes.json();
                    document.getElementById("companyCount").textContent = companies.length;
                }
                
                const stuRes = await fetch("/api/students");
                if(stuRes.ok) {
                    const students = await stuRes.json();
                    document.getElementById("studentCount").textContent = students.length;
                }

                const appRes = await fetch("/api/companies/all-applications/list");
                if(appRes.ok) {
                    const apps = await appRes.json();
                    document.getElementById("applicationCount").textContent = apps.length;
                    const placed = apps.filter(a => a.status === "Selected").length;
                    document.getElementById("placedCount").textContent = placed;
                }
            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        // Company Form
        document.getElementById("companyForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById("companyName").value,
                role: document.getElementById("jobRole").value,
                eligibility: document.getElementById("eligibility").value,
                location: document.getElementById("location").value,
                package: document.getElementById("package").value
            };

            try {
                const res = await fetch("/api/companies", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    showToast("Company added!", "success");
                    document.getElementById("companyForm").reset();
                    loadDashboardStats();
                } else {
                    const err = await res.json();
                    showToast(err.message || "Failed to add company", "error");
                }
            } catch (err) {
                showToast("Error adding company", "error");
            }
        });

        // Load Companies
        async function loadCompanies() {
            const list = document.getElementById("companyList");
            list.innerHTML = "Loading...";
            try {
                const res = await fetch("/api/companies");
                if (res.ok) {
                    const companies = await res.json();
                    if (companies.length === 0) {
                        list.innerHTML = "<div class='empty-state'>No companies added yet.</div>";
                        return;
                    }
                    
                    list.innerHTML = companies.map(c => `
                        <div class="company-card">
                            <h3>${c.name}</h3>
                            <div class="detail"><span class="label">Role:</span> ${c.role}</div>
                            <div class="detail"><span class="label">Eligibility:</span> ${c.eligibility}</div>
                            <div class="detail"><span class="label">Location:</span> ${c.location}</div>
                            <div class="detail"><span class="label">Package:</span> ${c.package}</div>
                            <div class="actions">
                                <button class="btn-danger btn-sm" onclick="deleteCompany('${c._id}')">Delete</button>
                            </div>
                        </div>
                    `).join("");
                }
            } catch (err) {
                list.innerHTML = "<div class='empty-state'>Error loading companies</div>";
            }
        }

        // Delete Company
        async function deleteCompany(id) {
            if (!confirm("Are you sure you want to delete this company?")) return;
            try {
                const res = await fetch(`/api/companies/${id}`, { method: "DELETE" });
                if (res.ok) {
                    showToast("Company deleted", "success");
                    loadCompanies();
                    loadDashboardStats();
                } else {
                    showToast("Failed to delete company", "error");
                }
            } catch (err) {
                showToast("Error deleting company", "error");
            }
        }

        // Load Students
        async function loadStudents() {
            const container = document.getElementById("studentList");
            container.innerHTML = "Loading...";
            try {
                const res = await fetch("/api/students");
                if (res.ok) {
                    const students = await res.json();
                    if (students.length === 0) {
                        container.innerHTML = "<div class='empty-state'>No students registered yet.</div>";
                        return;
                    }

                    let tableHtml = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Branch</th>
                                    <th>CGPA</th>
                                    <th>Skills</th>
                                    <th>Registered Date</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    tableHtml += students.map(s => {
                        const skills = (s.skills && s.skills.length) ? s.skills.join(", ") : "—";
                        const date = s.createdAt ? new Date(s.createdAt).toLocaleDateString() : "—";
                        return `
                            <tr>
                                <td>${s.name}</td>
                                <td>${s.email}</td>
                                <td>${s.branch || "—"}</td>
                                <td>${s.cgpa || "—"}</td>
                                <td>${skills}</td>
                                <td>${date}</td>
                            </tr>
                        `;
                    }).join("");

                    tableHtml += `</tbody></table>`;
                    container.innerHTML = tableHtml;
                }
            } catch (err) {
                container.innerHTML = "<div class='empty-state'>Error loading students</div>";
            }
        }

        // Load Applications
        async function loadApplications() {
            const container = document.getElementById("applicationList");
            container.innerHTML = "Loading...";
            try {
                const res = await fetch("/api/companies/all-applications/list");
                if (res.ok) {
                    const apps = await res.json();
                    if (apps.length === 0) {
                        container.innerHTML = "<div class='empty-state'>No applications found.</div>";
                        return;
                    }

                    let tableHtml = `
                        <div class="glass-card">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>Company</th>
                                    <th>Role</th>
                                    <th>Package</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    tableHtml += apps.map(app => {
                        const statusClass = `badge badge-${app.status.toLowerCase()}`;
                        let actionsHtml = "";
                        if (app.status === "Applied") {
                            actionsHtml = `
                                <button class="btn-warning btn-sm" onclick="updateStatus('${app._id}', 'Shortlisted')">Shortlist</button>
                                <button class="btn-danger btn-sm" onclick="updateStatus('${app._id}', 'Rejected')">Reject</button>
                            `;
                        } else if (app.status === "Shortlisted") {
                            actionsHtml = `
                                <button class="btn-success btn-sm" onclick="updateStatus('${app._id}', 'Selected')">Select</button>
                                <button class="btn-danger btn-sm" onclick="updateStatus('${app._id}', 'Rejected')">Reject</button>
                            `;
                        } else if (app.status === "Selected" || app.status === "Rejected") {
                            actionsHtml = `<span class="${statusClass}">${app.status}</span>`;
                        }

                        return `
                            <tr>
                                <td>${app.student ? app.student.name : "—"}</td>
                                <td>${app.company ? app.company.name : "—"}</td>
                                <td>${app.company ? app.company.role : "—"}</td>
                                <td>${app.company ? app.company.package : "—"}</td>
                                <td><span class="${statusClass}">${app.status}</span></td>
                                <td>${actionsHtml}</td>
                            </tr>
                        `;
                    }).join("");

                    tableHtml += `</tbody></table></div>`;
                    container.innerHTML = tableHtml;
                }
            } catch (err) {
                container.innerHTML = "<div class='empty-state'>Error loading applications</div>";
            }
        }

        // Update Application Status
        async function updateStatus(applicationId, status) {
            try {
                const res = await fetch(`/api/companies/applications/${applicationId}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status })
                });

                if (res.ok) {
                    showToast("Status updated!", "success");
                    loadApplications();
                    loadDashboardStats();
                } else {
                    const err = await res.json();
                    showToast(err.message || "Failed to update status", "error");
                }
            } catch (err) {
                showToast("Error updating status", "error");
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        // Init
        document.addEventListener("DOMContentLoaded", () => {
            loadDashboardStats();
        });
    </script>
</body>
</html>
