<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Placement Management System</title>
    <meta name="description" content="Register for the Placement Management System as a student or placement officer.">
    <script>
        if (window.location.protocol === "file:") {
            window.location.replace("http://localhost:5000/register.html");
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">🎓</div>
            <h1>Create Account</h1>
            <p>Join the placement portal</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="role">Register As</label>
                <select id="role" class="form-select" required>
                    <option value="">— Select Role —</option>
                    <option value="STUDENT-ORGANIZATION">College Student</option>
                    <option value="STUDENT-INDIVIDUAL">Individual Student</option>
                    <option value="PLACEMENT_OFFICER-ORGANIZATION">College Placement Officer</option>
                    <option value="RECRUITER-INDIVIDUAL">Public Recruiter</option>
                </select>
            </div>

            <div class="form-group" id="orgCodeGroup" style="display: none;">
                <label for="organizationCode">Organization Code</label>
                <input type="text" id="organizationCode" class="form-input" placeholder="e.g. SVEC-2026-X7K9">
            </div>

            <button type="submit" class="btn-primary">Create Account</button>

            <p id="message" style="text-align:center;margin-top:16px;font-weight:600;"></p>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="index.html">Sign In</a></p>
        </div>
    </div>
</div>

<script>
const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "https://placement-management-backend-x5mq.onrender.com";

// Toggle Organization Code Input Visibility
document.getElementById("role").addEventListener("change", function() {
    const roleVal = this.value;
    const orgCodeGroup = document.getElementById("orgCodeGroup");
    const organizationCodeInput = document.getElementById("organizationCode");
    
    if (roleVal.endsWith("-ORGANIZATION")) {
        orgCodeGroup.style.display = "block";
        organizationCodeInput.setAttribute("required", "required");
    } else {
        orgCodeGroup.style.display = "none";
        organizationCodeInput.removeAttribute("required");
        organizationCodeInput.value = "";
    }
});

document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const roleVal = document.getElementById("role").value;
    const message = document.getElementById("message");

    if (!roleVal) {
        message.style.color = "#ef4444";
        message.textContent = "Please select a role.";
        return;
    }

    const [role, accountType] = roleVal.split("-");
    const organizationCode = document.getElementById("organizationCode").value.trim();

    try {
        const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, role, accountType, organizationCode })
        });

        const data = await response.json();

        if (response.ok) {
            message.style.color = "#10b981";
            message.textContent = "✓ Registration successful! Logging in...";
            
            // Save token and user details to localStorage for automatic login
            localStorage.setItem("user", JSON.stringify(data.user));
            localStorage.setItem("token", data.token);

            setTimeout(() => {
                const normRole = role.toUpperCase();
                if (normRole === "STUDENT") {
                    window.location.href = "student-dashboard.html";
                } else if (normRole === "PLACEMENT_OFFICER") {
                    window.location.href = "admin-dashboard.html";
                } else if (normRole === "RECRUITER") {
                    window.location.href = "recruiter-dashboard.html";
                } else if (normRole === "SUPER_ADMIN") {
                    window.location.href = "super-admin-dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }, 1500);
        } else {
            message.style.color = "#ef4444";
            message.textContent = data.message || "Registration failed.";
        }
    } catch (error) {
        console.error(error);
        message.style.color = "#ef4444";
        message.textContent = "Cannot connect to server.";
    }
});

// Toggle Password Visibility
const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");

if (passwordInput && passwordToggle) {
    passwordToggle.addEventListener("click", () => {
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        passwordToggle.textContent = type === "password" ? "👁️" : "🙈";
    });
}
</script>

</body>
</html>
